# Independent from the scheduled report services.
services:
  stock-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: stock-review-web:local
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8081}:8081"
    environment:
      WEB_DATABASE_DSN: ${WEB_DATABASE_DSN:-}
      TZ: Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./reports/daily:/app/reports/daily:ro
      - ./reports/events:/app/reports/events:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 64
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
